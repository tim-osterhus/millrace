[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[project]
name = "millrace-ai"
version = "0.22.1"
description = "A governed runtime for compiler-validated, durable agent workflows."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Tim Osterhus", email = "tim@millrace.ai" },
]
dependencies = []

[project.scripts]
millrace = "millrace.adapters.cli.main:cli"

[project.urls]
Homepage = "https://github.com/tim-osterhus/millrace"
Repository = "https://github.com/tim-osterhus/millrace"
Issues = "https://github.com/tim-osterhus/millrace/issues"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "millrace"
source-include = [
    "FAQ.md",
    "LICENSE",
    "README.md",
    "docs/getting-started.md",
    "docs/migrating-from-v0.21.md",
    "docs/v0.22-compatibility.md",
    "docs/errors.md",
    "docs/how-millrace-works.md",
    "docs/runner-session-architecture.md",
    "docs/daemon-lifecycle.md",
    "docs/workflow-packages.md",
    "docs/millforge-runner.md",
    "docs/codex-runner.md",
]
source-exclude = [
    "/.gitignore",
    "**/.DS_Store",
    "/docs/maintainers/**",
    "/src/millrace/**/README.md",
    "/src/millrace/testing/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-p", "no:faker"]
markers = [
    "live_model: opt-in actual-model E2E rows; skipped unless explicit live config is present",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "tests"]
files = ["src"]
strict = true
explicit_package_bases = true
