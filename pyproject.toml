[build-system]
requires = ["uv_build==0.11.30"]
build-backend = "uv_build"

[project]
name = "millrace-ai"
version = "0.23.1"
description = "A standalone durable graph router with explicit controls."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Tim Osterhus", email = "tim@millrace.ai" },
]
dependencies = []

[project.scripts]
millrace = "millrace.router.cli:cli"

[project.urls]
Homepage = "https://github.com/tim-osterhus/millrace"
Repository = "https://github.com/tim-osterhus/millrace"
Issues = "https://github.com/tim-osterhus/millrace/issues"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "millrace"
source-include = ["LICENSE", "README.md", "CHANGELOG.md", "FAQ.md", "ROADMAP.md", "docs/**", "tests/**", "scripts/release/verify_v023_distribution.py"]
source-exclude = ["/.gitignore", "/.github/**", "**/.DS_Store", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-p", "no:faker"]
markers = [
    "live_model: opt-in actual-model E2E rows; skipped unless explicit live config is present",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "tests"]
files = ["src"]
strict = true
explicit_package_bases = true
