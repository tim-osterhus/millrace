name: CI

on:
  push:
  pull_request:

jobs:
  validation:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      UV_LINK_MODE: copy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.30

      - name: Set up qualified Pi Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Cache offline build backend
        run: >-
          uv run --no-project
          --with 'uv_build==0.11.30'
          python -c 'import uv_build'

      - name: Run tests
        run: |
          mkdir -m 700 "$HOME/mrc-tests"
          export MILLRACE_TEST_SOCKET_ROOT="$HOME/mrc-tests"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest -q --basetemp "$HOME/mrc-tests/pytest"

      - name: Run Ruff
        run: uv run --frozen ruff check src tests

      - name: Run mypy
        run: uv run --frozen mypy src

      - name: Build package
        run: uv build --force-pep517
