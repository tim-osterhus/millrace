name: Publish to PyPI

on:
  push:
    tags:
      - v0.22.3

jobs:
  validate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.22.3' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.9.30
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 uv run --frozen --group dev pytest -q
      - name: Lint
        run: uv run --frozen --group dev ruff check src tests scripts
      - name: Type check
        run: uv run --frozen --group dev mypy --strict src
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build
        run: |
          test ! -e dist
          SOURCE_DATE_EPOCH=1580601600 PYTHONDONTWRITEBYTECODE=1 uv build --python 3.11 --force-pep517
      - name: Verify built distributions
        shell: bash
        run: |
          expected=(
            ".gitignore"
            "millrace_ai-0.22.3-py3-none-any.whl"
            "millrace_ai-0.22.3.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected distribution set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          sha256sum --check --strict <<'SHA256'
          4498c9d1fbd64305a549d6729494965e5e5a6a8b5ffac7a2a2212c37b1b1acd0  dist/millrace_ai-0.22.3-py3-none-any.whl
          24204bc478396aa1eeb3aa2b5d47db08668e1780b683122e786e64141f703a96  dist/millrace_ai-0.22.3.tar.gz
          SHA256
      - name: Check source unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all -- ':!dist')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_ai-0.22.3-py3-none-any.whl
            dist/millrace_ai-0.22.3.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.22.3' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distributions
        shell: bash
        run: |
          expected=(
            "millrace_ai-0.22.3-py3-none-any.whl"
            "millrace_ai-0.22.3.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected downloaded distribution set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          sha256sum --check --strict <<'SHA256'
          4498c9d1fbd64305a549d6729494965e5e5a6a8b5ffac7a2a2212c37b1b1acd0  dist/millrace_ai-0.22.3-py3-none-any.whl
          24204bc478396aa1eeb3aa2b5d47db08668e1780b683122e786e64141f703a96  dist/millrace_ai-0.22.3.tar.gz
          SHA256
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
