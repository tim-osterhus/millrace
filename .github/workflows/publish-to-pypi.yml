name: Publish to PyPI

on:
  push:
    tags:
      - v0.23.1

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1580601600"
  PYTHONDONTWRITEBYTECODE: "1"
  EXPECTED_WHEEL_SHA256: "b5c2ac37259031136384e1d573dae8ea0e7597e5b1c792bd26ae42c019ab7778"
  EXPECTED_SDIST_SHA256: "d3a1c47d658f56b2e0a360f944f2b4d93e0cfa6e45dafaed7481e5539b826e87"

jobs:
  validate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag and package identity
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, tomllib
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert os.environ["GITHUB_EVENT_NAME"] == "push"
          assert os.environ["GITHUB_REF"] == "refs/tags/v0.23.1"
          head = git("rev-parse", "HEAD")
          assert git("rev-parse", "refs/tags/v0.23.1^{}") == head
          assert os.environ["GITHUB_SHA"] == head
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "millrace-ai" and project["version"] == "0.23.1"
          PYCODE
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Validate active Core
        run: |
          uv lock --check
          uv sync --frozen --group dev
          mkdir -m 700 "$HOME/mrc-tests"
          MILLRACE_TEST_SOCKET_ROOT="$HOME/mrc-tests" PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run --frozen --group dev pytest -q --basetemp "$HOME/mrc-tests/pytest"
          uv run --frozen --group dev ruff check src tests scripts
          uv run --frozen --group dev mypy --strict src
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build
        run: |
          test ! -e dist
          uv build --force-pep517 --python 3.11
      - name: Verify selected distribution manifest
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          expected = {"millrace_ai-0.23.1-py3-none-any.whl": os.environ["EXPECTED_WHEEL_SHA256"],
                      "millrace_ai-0.23.1.tar.gz": os.environ["EXPECTED_SDIST_SHA256"]}
          assert {p.name for p in Path("dist").iterdir() if p.name != ".gitignore"} == set(expected)
          for name, digest in expected.items():
              assert digest != "0" * 64, "Release artifact manifest has not been frozen"
              assert hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest() == digest
          PYCODE
      - name: Check source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_ai-0.23.1-py3-none-any.whl
            dist/millrace_ai-0.23.1.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.1' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distribution set
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          assert {p.name for p in Path("dist").iterdir()} == {"millrace_ai-0.23.1-py3-none-any.whl", "millrace_ai-0.23.1.tar.gz"}
          files = sorted(Path("dist").iterdir())
          for path in files:
              key = "EXPECTED_WHEEL_SHA256" if path.suffix == ".whl" else "EXPECTED_SDIST_SHA256"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ[key]
          PYCODE
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
