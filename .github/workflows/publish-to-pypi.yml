name: Publish to PyPI

on:
  push:
    tags:
      - v0.23.0

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1580601600"
  PYTHONDONTWRITEBYTECODE: "1"
  EXPECTED_WHEEL_SHA256: "56d4bd001c9c5875b6f7fec55369754c43a07f5d2ce0e334a2057c63521b858c"
  EXPECTED_SDIST_SHA256: "4a8716cfd1e02c86165372ff005e241dc14346b5c6b51389fa634f9b3aecef5c"

jobs:
  validate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.5
      - name: Validate active Core
        run: |
          uv lock --check
          uv sync --frozen --group dev
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run --frozen --group dev pytest -q
          uv run --frozen --group dev ruff check src tests scripts
          uv run --frozen --group dev mypy --strict src
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build
        run: |
          test ! -e dist
          uv build --force-pep517 --python 3.11
      - name: Verify selected distribution manifest
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          expected = {"millrace_ai-0.23.0-py3-none-any.whl": os.environ["EXPECTED_WHEEL_SHA256"],
                      "millrace_ai-0.23.0.tar.gz": os.environ["EXPECTED_SDIST_SHA256"]}
          assert {p.name for p in Path("dist").iterdir() if p.name != ".gitignore"} == set(expected)
          for name, digest in expected.items():
              assert digest != "0" * 64, "Release artifact manifest has not been frozen"
              assert hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest() == digest
          PYCODE
      - name: Check source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_ai-0.23.0-py3-none-any.whl
            dist/millrace_ai-0.23.0.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.23.0' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distribution set
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          assert {p.name for p in Path("dist").iterdir()} == {"millrace_ai-0.23.0-py3-none-any.whl", "millrace_ai-0.23.0.tar.gz"}
          files = sorted(Path("dist").iterdir())
          for path in files:
              key = "EXPECTED_WHEEL_SHA256" if path.suffix == ".whl" else "EXPECTED_SDIST_SHA256"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ[key]
          PYCODE
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
