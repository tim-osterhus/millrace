name: Publish to PyPI

on:
  push:
    tags:
      - v0.22.3

jobs:
  validate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.22.3' }}
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.9.30
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Cache offline build backend
        run: >-
          uv run --no-project
          --with 'uv_build==0.11.30'
          python -c 'import uv_build'
      - name: Test
        run: |
          mkdir -m 700 "$HOME/mrc-tests"
          export MILLRACE_TEST_SOCKET_ROOT="$HOME/mrc-tests"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 uv run --frozen --group dev pytest -q
      - name: Lint
        run: uv run --frozen --group dev ruff check src tests scripts
      - name: Type check
        run: uv run --frozen --group dev mypy --strict src
      - name: Check clean source tree
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build
        run: |
          test ! -e dist
          SOURCE_DATE_EPOCH=1580601600 PYTHONDONTWRITEBYTECODE=1 uv build --python 3.11 --force-pep517
      - name: Verify built distributions
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = """
          5e87f92f2330af30395f35860d319db7e5574367da7995a3613276d0a08f163d  dist/millrace_ai-0.22.3-py3-none-any.whl
          4f500e6e474fa087dbc0f8a5d8f8f137370a71d9a04d4663f67eb6af37acf6eb  dist/millrace_ai-0.22.3.tar.gz
          """
          expected = {Path(path): digest for digest, path in
                      (line.split() for line in manifest.strip().splitlines())}
          assert {p.name for p in Path("dist").iterdir()} == (
              {p.name for p in expected} | {".gitignore"})
          for path, digest in expected.items():
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, path
          PY
      - name: Check source unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all -- ':!dist')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_ai-0.22.3-py3-none-any.whl
            dist/millrace_ai-0.22.3.tar.gz

  publish:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.22.3' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify downloaded distributions
        shell: bash
        run: |
          expected=(
            "millrace_ai-0.22.3-py3-none-any.whl"
            "millrace_ai-0.22.3.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected downloaded distribution set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          sha256sum --check --strict <<'SHA256'
          5e87f92f2330af30395f35860d319db7e5574367da7995a3613276d0a08f163d  dist/millrace_ai-0.22.3-py3-none-any.whl
          4f500e6e474fa087dbc0f8a5d8f8f137370a71d9a04d4663f67eb6af37acf6eb  dist/millrace_ai-0.22.3.tar.gz
          SHA256
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
