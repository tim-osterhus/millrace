name: Repo Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Run pytest
        run: uv run --extra dev python -m pytest -q

      - name: Run Ruff
        run: uv run --with ruff ruff check src/millrace_ai tests

      - name: Run MyPy
        run: uv run --with mypy mypy src/millrace_ai

      - name: Install optional web package for tests
        run: python -m pip install -e . -e "packages/millrace-web[dev]"

      - name: Run optional web package tests
        run: python -m pytest packages/millrace-web/tests -q

      - name: Run optional web package Ruff
        run: python -m ruff check packages/millrace-web
